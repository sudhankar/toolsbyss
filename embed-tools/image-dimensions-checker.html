<!DOCTYPE html>
<html lang="hi"><head><script defer="" src="/assets/js/master-config.js"></script><script defer="" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script defer="" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="noindex,nofollow" name="robots"/><link href="/core/core.css" rel="stylesheet"/><link href="/tools/finance/finance-tools.css" rel="stylesheet"/><link href="/assets/css/toolsbyss-tool-theme.css" rel="stylesheet"/></head><body data-tool="image-dimensions-checker" style="margin:0;padding:14px;background:#fff;color:#17212b;font-family:Arial,sans-serif"><div id="embed-auth-wall" style="position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#061522,#0b3530);color:#f2fffa;text-align:center;font-family:Arial,sans-serif"><div style="max-width:480px;padding:30px;border:1px solid #71f3c455;border-radius:22px;background:#0c2637"><div style="font-size:30px">🔐</div><h2>Sign in required</h2><p style="color:#b3cbd0">This tool is available after you sign in with a verified ToolsBySS account.</p><a href="/login/?next=/tools/image-dimensions-checker/" style="display:inline-block;padding:11px 18px;border-radius:99px;background:#71f3c4;color:#08251b;font-weight:bold;text-decoration:none">Sign in / Create account</a></div></div><div class="sf-tool image-dimensions-checker" data-sf-tool="image-dimensions-checker">
<div class="sf-adv-heading"><h2>Image Dimensions Checker</h2><p>इमेज का आकार, फॉर्मेट, फाइल साइज, पिक्सल और उपलब्ध मेटाडेटा देखें। फ़ाइलें आपके ब्राउज़र में प्रोसेस होती हैं।</p></div>
<label class="sf-adv-drop"><strong>इमेज चुनें</strong><br/><span>JPG, PNG, WebP आदि समर्थित इमेज चुनें।</span><input accept="image/*" aria-label="इमेज चुनें" class="sf-adv-files" type="file"/></label>
<div class="sf-adv-controls"></div><div aria-live="polite" class="sf-adv-preview"></div>
<div class="sf-adv-actions"><button class="sf-adv-btn sf-adv-run" disabled="" type="button">प्रोसेस करें और डाउनलोड करें</button><button class="sf-adv-btn sf-adv-clear" type="button">रीसेट</button></div><p aria-live="polite" class="sf-adv-status" role="status"></p>
</div>
<script>window.addEventListener("DOMContentLoaded",()=>{const o=new ResizeObserver(()=>parent.postMessage({type:"toolsbyss-resize",height:document.documentElement.scrollHeight},location.origin));o.observe(document.documentElement)});</script><script>
document.addEventListener('DOMContentLoaded', () => {
  const activityEvents = ['pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll'];
  activityEvents.forEach(eventName => {
    document.addEventListener(eventName, () => {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'toolsbyss-activity' }, location.origin);
      }
    }, { passive: true });
  });

  const config = window.TOOLSBySS_MASTER || {};
  const wall = document.querySelector('#embed-auth-wall, #pdf-editor-auth-wall');
  const isPdfEditor = !!document.getElementById('pdf-editor-auth-wall');
  let started = false;

  const showWall = () => {
    if (wall && wall.isConnected) wall.style.display = 'grid';
  };

  const loadScript = src => new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`Could not load ${src}`));
    document.body.appendChild(script);
  });

  const startTool = async () => {
    if (started) return;
    started = true;
    wall?.remove();

    try {
      if (isPdfEditor) {
        for (const placeholder of Array.from(document.querySelectorAll('script[data-late-src]'))) {
          await loadScript(placeholder.dataset.lateSrc);
          placeholder.remove();
        }
        await loadScript('/assets/js/download-branding.js');
      } else {
        await loadScript('/assets/js/download-branding.js');
        await loadScript('/core/loader.js');
      }
    } catch (error) {
      console.error('ToolsBySS tool startup failed:', error);
      if (wall && !wall.isConnected) document.body.appendChild(wall);
      showWall();
      const message = wall?.querySelector('p');
      if (message) message.textContent = 'The tool could not load. Please refresh the page and try again.';
      started = false;
    }
  };

  if (window.parent !== window) {
    // The parent tool page has already verified the Firebase user. Use its
    // same-origin auth state rather than creating a second competing session.
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== window.parent) return;
      if (event.data?.type !== 'toolsbyss-auth-state') return;
      if (event.data.verified === true) startTool();
      else showWall();
    });
    window.parent.postMessage({ type: 'toolsbyss-embed-ready' }, location.origin);
  } else {
    // Keep direct access to an embed page gated as well.
    if (!config.firebase?.enabled || !config.firebase.apiKey || !window.firebase) {
      showWall();
      return;
    }
    try {
      if (!firebase.apps || firebase.apps.length === 0) {
        firebase.initializeApp({
          apiKey: config.firebase.apiKey,
          authDomain: config.firebase.authDomain,
          projectId: config.firebase.projectId,
          appId: config.firebase.appId
        });
      }
      const firebaseAuth = firebase.auth();
      firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION).then(() => {
        firebaseAuth.onAuthStateChanged(currentUser => {
          if (currentUser && currentUser.emailVerified) startTool();
          else showWall();
        });
      }).catch(error => {
        console.error('Embed authentication could not be restored:', error);
        showWall();
      });
    } catch (error) {
      console.error('Embed authentication error:', error);
      showWall();
    }
  }
});
</script></body></html>
