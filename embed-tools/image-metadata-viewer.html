  <div class="sf-adv-heading"><h2>Image Metadata Viewer</h2><p>स्थानीय इमेज के उपलब्ध EXIF/JPEG मेटाडेटा को पढ़ें; फाइल कहीं अपलोड नहीं होती। फ़ाइलें आपके ब्राउज़र में प्रोसेस होती हैं।</p></div>

</div>

<script>window.addEventListener("DOMContentLoaded",()=>{const o=new ResizeObserver(()=>parent.postMessage({type:"toolsbyss-resize",height:document.documentElement.scrollHeight},location.origin));o.observe(document.documentElement)});</script><script>
document.addEventListener('DOMContentLoaded',()=>{['pointerdown','keydown','wheel','touchstart','scroll','mousemove'].forEach(evt=>document.addEventListener(evt,()=>parent.postMessage({type:'toolsbyss-activity'},location.origin),{passive:true}));
 const C=window.TOOLSBySS_MASTER||{},wall=document.getElementById('embed-auth-wall');
 if(!C.firebase||!C.firebase.enabled||!window.firebase){wall.style.display='grid';return;}
 try{firebase.initializeApp({apiKey:C.firebase.apiKey,authDomain:C.firebase.authDomain,projectId:C.firebase.projectId,appId:C.firebase.appId});
 const a=firebase.auth();a.setPersistence(firebase.auth.Auth.Persistence.SESSION).then(()=>a.onAuthStateChanged(u=>{
  if(!u||!u.emailVerified){wall.style.display='grid';return;}
  if(window.__toolsBySSEmbedStarted)return;window.__toolsBySSEmbedStarted=true;wall.remove();
  const b=document.createElement('script');b.src='/assets/js/download-branding.js';document.body.appendChild(b);const s=document.createElement('script');s.src='/core/loader.js';document.body.appendChild(s);
  const o=new ResizeObserver(()=>parent.postMessage({type:'toolsbyss-resize',height:document.documentElement.scrollHeight},location.origin));o.observe(document.documentElement);
 }));}catch(e){wall.style.display='grid';console.error(e);}
});
</script></body></html>
