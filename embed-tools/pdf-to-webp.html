<!doctype html><html lang="hi"><head><script defer src="/assets/js/master-config.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/core/core.css"><link rel="stylesheet" href="/tools/finance/finance-tools.css"></head><body data-tool="pdf-to-webp" style="margin:0;padding:14px;background:#fff;color:#17212b;font-family:Arial,sans-serif"><div id="embed-auth-wall" style="position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#061522,#0b3530);color:#f2fffa;text-align:center;font-family:Arial,sans-serif"><div style="max-width:480px;padding:30px;border:1px solid #71f3c455;border-radius:22px;background:#0c2637"><div style="font-size:30px">🔐</div><h2>Sign in required</h2><p style="color:#b3cbd0">This tool is available after you sign in with a verified ToolsBySS account.</p><a href="/login/?next=/tools/pdf-to-webp/" style="display:inline-block;padding:11px 18px;border-radius:99px;background:#71f3c4;color:#08251b;font-weight:bold;text-decoration:none">Sign in / Create account</a></div></div><div class="sf-tool sf-pdf-to-webp" data-sf-tool="pdf-to-webp">

<div class="sfmini-card"><h2>PDF to WebP</h2><p>PDF के किसी भी पेज को WebP इमेज में बदलें। पेज नंबर, रिज़ॉल्यूशन और क्वालिटी चुनें।</p><div class="sf-file-drop"><input data-sfwebp-file type="file" accept="application/pdf,.pdf"><strong>PDF चुनें या यहाँ क्लिक करें</strong></div><div class="sf-preview-grid" data-sfwebp-preview></div><div class="sfmini-fields"><label>पेज नंबर<input data-sfwebp-page type="number" min="1" value="1"></label><label>रिज़ॉल्यूशन स्केल<input data-sfwebp-scale type="number" min="0.5" max="4" step="0.5" value="2"></label><label>क्वालिटी (0.3–1)<input data-sfwebp-quality type="number" min="0.3" max="1" step="0.05" value="0.85"></label></div><div class="sfmini-actions"><button class="sfmini-btn" data-sfwebp-go disabled>⬇️ WebP डाउनलोड करें</button><button class="sfmini-btn secondary" data-sfwebp-clear>🗑️ Clear PDF</button></div><p data-sf-status role="status"></p></div></div><script>window.addEventListener("DOMContentLoaded",()=>{const o=new ResizeObserver(()=>parent.postMessage({type:"toolsbyss-resize",height:document.documentElement.scrollHeight},location.origin));o.observe(document.documentElement)});</script><script>
document.addEventListener('DOMContentLoaded', () => {
  const activityEvents = ['pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll'];
  activityEvents.forEach(eventName => {
    document.addEventListener(eventName, () => {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'toolsbyss-activity' }, location.origin);
      }
    }, { passive: true });
  });

  const config = window.TOOLSBySS_MASTER || {};
  const wall = document.querySelector('#embed-auth-wall, #pdf-editor-auth-wall');
  const isPdfEditor = !!document.getElementById('pdf-editor-auth-wall');
  let started = false;

  const showWall = () => {
    if (wall && wall.isConnected) wall.style.display = 'grid';
  };

  const loadScript = src => new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`Could not load ${src}`));
    document.body.appendChild(script);
  });

  const startTool = async () => {
    if (started) return;
    started = true;
    wall?.remove();

    try {
      if (isPdfEditor) {
        for (const placeholder of Array.from(document.querySelectorAll('script[data-late-src]'))) {
          await loadScript(placeholder.dataset.lateSrc);
          placeholder.remove();
        }
        await loadScript('/assets/js/download-branding.js');
      } else {
        await loadScript('/assets/js/download-branding.js');
        await loadScript('/core/loader.js');
      }
    } catch (error) {
      console.error('ToolsBySS tool startup failed:', error);
      if (wall && !wall.isConnected) document.body.appendChild(wall);
      showWall();
      const message = wall?.querySelector('p');
      if (message) message.textContent = 'The tool could not load. Please refresh the page and try again.';
      started = false;
    }
  };

  if (window.parent !== window) {
    // The parent tool page has already verified the Firebase user. Use its
    // same-origin auth state rather than creating a second competing session.
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== window.parent) return;
      if (event.data?.type !== 'toolsbyss-auth-state') return;
      if (event.data.verified === true) startTool();
      else showWall();
    });
    window.parent.postMessage({ type: 'toolsbyss-embed-ready' }, location.origin);
  } else {
    // Keep direct access to an embed page gated as well.
    if (!config.firebase?.enabled || !config.firebase.apiKey || !window.firebase) {
      showWall();
      return;
    }
    try {
      if (!firebase.apps || firebase.apps.length === 0) {
        firebase.initializeApp({
          apiKey: config.firebase.apiKey,
          authDomain: config.firebase.authDomain,
          projectId: config.firebase.projectId,
          appId: config.firebase.appId
        });
      }
      const firebaseAuth = firebase.auth();
      firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION).then(() => {
        firebaseAuth.onAuthStateChanged(currentUser => {
          if (currentUser && currentUser.emailVerified) startTool();
          else showWall();
        });
      }).catch(error => {
        console.error('Embed authentication could not be restored:', error);
        showWall();
      });
    } catch (error) {
      console.error('Embed authentication error:', error);
      showWall();
    }
  }
});
</script></body></html>
