<!doctype html><html lang="hi"><head><script defer src="/assets/js/master-config.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/core/core.css"><link rel="stylesheet" href="/tools/finance/finance-tools.css"></head><body data-tool="pdf-to-webp" style="margin:0;padding:14px;background:#fff;color:#17212b;font-family:Arial,sans-serif"><div id="embed-auth-wall" style="position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#061522,#0b3530);color:#f2fffa;text-align:center;font-family:Arial,sans-serif"><div style="max-width:480px;padding:30px;border:1px solid #71f3c455;border-radius:22px;background:#0c2637"><div style="font-size:30px">🔐</div><h2>Sign in required</h2><p style="color:#b3cbd0">This tool is available after you sign in with a verified ToolsBySS account.</p><a href="/login/?next=/tools/pdf-to-webp/" style="display:inline-block;padding:11px 18px;border-radius:99px;background:#71f3c4;color:#08251b;font-weight:bold;text-decoration:none">Sign in / Create account</a></div></div><div class="sf-tool sf-pdf-to-webp" data-sf-tool="pdf-to-webp">

<div class="sfmini-card"><h2>PDF to WebP</h2><p>PDF के किसी भी पेज को WebP इमेज में बदलें। पेज नंबर, रिज़ॉल्यूशन और क्वालिटी चुनें।</p><div class="sf-file-drop"><input data-sfwebp-file type="file" accept="application/pdf,.pdf"><strong>PDF चुनें या यहाँ क्लिक करें</strong></div><div class="sf-preview-grid" data-sfwebp-preview></div><div class="sfmini-fields"><label>पेज नंबर<input data-sfwebp-page type="number" min="1" value="1"></label><label>रिज़ॉल्यूशन स्केल<input data-sfwebp-scale type="number" min="0.5" max="4" step="0.5" value="2"></label><label>क्वालिटी (0.3–1)<input data-sfwebp-quality type="number" min="0.3" max="1" step="0.05" value="0.85"></label></div><div class="sfmini-actions"><button class="sfmini-btn" data-sfwebp-go disabled>⬇️ WebP डाउनलोड करें</button><button class="sfmini-btn secondary" data-sfwebp-clear>🗑️ Clear PDF</button></div><p data-sf-status role="status"></p></div></div><script>window.addEventListener("DOMContentLoaded",()=>{const o=new ResizeObserver(()=>parent.postMessage({type:"toolsbyss-resize",height:document.documentElement.scrollHeight},location.origin));o.observe(document.documentElement)});</script><script>
document.addEventListener('DOMContentLoaded',()=>{['pointerdown','keydown','wheel','touchstart','scroll','mousemove'].forEach(evt=>document.addEventListener(evt,()=>parent.postMessage({type:'toolsbyss-activity'},location.origin),{passive:true}));
 const C=window.TOOLSBySS_MASTER||{},wall=document.getElementById('embed-auth-wall');
 if(!C.firebase||!C.firebase.enabled||!window.firebase){wall.style.display='grid';return;}
 try{firebase.initializeApp({apiKey:C.firebase.apiKey,authDomain:C.firebase.authDomain,projectId:C.firebase.projectId,appId:C.firebase.appId});
 const a=firebase.auth();a.setPersistence(firebase.auth.Auth.Persistence.SESSION).then(()=>a.onAuthStateChanged(u=>{
  if(!u||!u.emailVerified){wall.style.display='grid';return;}
  if(window.__toolsBySSEmbedStarted)return;window.__toolsBySSEmbedStarted=true;wall.remove();
  const b=document.createElement('script');b.src='/assets/js/download-branding.js';document.body.appendChild(b);const s=document.createElement('script');s.src='/core/loader.js';document.body.appendChild(s);
  const o=new ResizeObserver(()=>parent.postMessage({type:'toolsbyss-resize',height:document.documentElement.scrollHeight},location.origin));o.observe(document.documentElement);
 }));}catch(e){wall.style.display='grid';console.error(e);}
});
</script></body></html>
